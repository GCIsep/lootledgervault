#/ O Menu inicial (com o botão para entrar, tipo matrix-nixxie3 */
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loot Ledger Vault</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap'); /* Fallout terminal feel */
        
        :root {
            --matrix-green: #00FF41;
            --dark-bg: #0A0A0A;
        }
        
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: var(--matrix-green);
            font-family: 'VT323', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        /* O Efeito Matrix digital rain simples */
        #canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.15;
        }
        
        .content {
            z-index: 2;
            text-align: center;
            border: 3px solid var(--matrix-green);
            padding: 40px 60px;
            background: rgba(10, 10, 10, 0.85);
            box-shadow: 0 0 30px var(--matrix-green);
        }
        
        h1 {
            font-size: 4.5rem;
            margin: 0 0 20px 0;
            text-shadow: 0 0 20px var(--matrix-green);
            letter-spacing: 8px;
        }
        
        p {
            font-size: 1.8rem;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        
        .enter-btn {
            font-family: 'VT323', monospace;
            font-size: 2rem;
            padding: 15px 50px;
            background: transparent;
            color: var(--matrix-green);
            border: 3px solid var(--matrix-green);
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        
        .enter-btn:hover {
            background: var(--matrix-green);
            color: #000;
            box-shadow: 0 0 40px var(--matrix-green);
        }
        
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 255, 65, 0.08) 50%
            );
            background-size: 100% 6px;
            pointer-events: none;
            animation: scan 4s linear infinite;
            z-index: 3;
        }
        
        @keyframes scan {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }
    </style>
</head>
<body>
    <!-- Canvas para chuva de Matrix -->
    <canvas id="canvas"></canvas>
    
    <div class="content">
        <h1>LOOT LEDGER VAULT</h1>
        <p>INVENTORY MANAGEMENT • ANONYMOUS TRADING • SYSTEM ONLINE</p>
        <button class="enter-btn" onclick="enterVault()">ENTER THE VAULT</button>
        
        <p style="font-size:1rem; margin-top:40px; opacity:0.6;">
            Grupo 4 • Ana Luísa • João Afonso • André Assunção<br>
            ISEP • P06 – Gestão de Inventário
        </p>
    </div>
    
    <div class="scanline"></div>

    <script>
        // Efeito Matrix digital rain simples
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        const characters = '01アイウエオ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const fontSize = 14;
        let drops = [];
        
        function initRain() {
            drops = [];
            const columns = canvas.width / fontSize;
            for (let x = 0; x < columns; x++) {
                drops[x] = Math.floor(Math.random() * canvas.height / fontSize);
            }
        }
        
        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#00FF41';
            ctx.font = `${fontSize}px monospace`;
            
            for (let i = 0; i < drops.length; i++) {
                const text = characters[Math.floor(Math.random() * characters.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        
        function animate() {
            draw();
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', () => {
            resizeCanvas();
            initRain();
        });
        
        // Inicialização do efeito 
        resizeCanvas();
        initRain();
        animate();
        
        // Botão Enter para entrada
        function enterVault() {
            window.location.href = 'inventory.html'; // próximo ficheiro que temos q criar 
            // Adicionar um Alerta ("Bem-vindo ao Vault. Sessão anónima iniciada.")
        }
        
        console.log('%cLoot Ledger Vault – Sistema inicializado. Anonimato ativado.', 'color:#00FF41; font-family:monospace');
    </script>
</body>
</html>
