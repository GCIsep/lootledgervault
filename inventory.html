<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário - Loja de Jogos</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header>
        <h1>Gestão de Inventário</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="calendario.html">Calendário</a>
        </nav>
    </header>

    <main>
        <div class="controls-panel">
            <label>
                <input type="checkbox" id="toggle-add" />
                Adicionar
            </label>
            <label>
                <input type="checkbox" id="toggle-remove" />
                Remover
            </label>
        </div>

        <section id="add-item" class="add-item hidden">
            <h2>Novo jogo</h2>
            <form id="add-form">
                <label>Título
                    <input type="text" id="title" required>
                </label>
                <label>Plataforma
                    <input type="text" id="platform" required>
                </label>
                <label>Stock
                    <input type="number" id="stock" min="0" required>
                </label>
                <label>Preço
                    <input type="number" id="price" step="0.01" min="0" required>
                </label>
                <label>Imagem
                    <input type="file" id="image" accept="image/*" required>
                </label>
                <button type="submit">Salvar</button>
            </form>
        </section>

        <section class="inventory-container">
            <h2>Inventário Atual</h2>
            <table>
                <thead>
                    <tr>
                        <th>Capa</th>
                        <th>Título</th>
                        <th>Plataforma</th>
                        <th>Stock</th>
                        <th>Preço</th>
                    </tr>
                </thead>
                <tbody id="inventory-body"></tbody>
            </table>
        </section>
    </main>

    <script src="database.js"></script>
    <script>
        function renderInventory() {
            const tbody = document.getElementById('inventory-body');
            tbody.innerHTML = '';
            database.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><img src="${item.img}" alt="${item.title}" width="50"></td>
                    <td>${item.title}</td>
                    <td>${item.platform}</td>
                    <td>${item.stock}</td>
                    <td>${item.price.toFixed(2)}€</td>
                `;
                tbody.appendChild(row);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const toggleAddCheckbox = document.getElementById('toggle-add');
            const toggleRemoveCheckbox = document.getElementById('toggle-remove');
            const addSection = document.getElementById('add-item');

            toggleAddCheckbox.addEventListener('change', () => {
                if (toggleAddCheckbox.checked) {
                    addSection.classList.remove('hidden');
                    addSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } else {
                    addSection.classList.add('hidden');
                }
            });

            if (window.location.hash === '#add-item') {
                toggleAddCheckbox.checked = true;
                addSection.classList.remove('hidden');
                addSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            renderInventory();

            document.getElementById('add-form').addEventListener('submit', event => {
                event.preventDefault();

                const imageFile = document.getElementById('image').files[0];
                if (!imageFile) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    database.push({
                        img: e.target.result,
                        title: document.getElementById('title').value,
                        platform: document.getElementById('platform').value,
                        stock: Number(document.getElementById('stock').value),
                        price: Number(document.getElementById('price').value)
                    });
                    saveDatabase();
                    renderInventory();
                    event.target.reset();
                };
                reader.readAsDataURL(imageFile);
            });
        });
    </script>
</body>
</html>
