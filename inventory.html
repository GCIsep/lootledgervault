<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário - Loja de Jogos</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header>
        <h1>Gestão de Inventário</h1>
        <nav>
            <a href="index.html">Início</a>
        </nav>
    </header>

    <main>
        <section class="inventory-container">
            <table>
                <thead>
                    <tr>
                        <th>Capa</th>
                        <th>Título</th>
                        <th>Plataforma</th>
                        <th>Stock</th>
                        <th>Preço</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="item-disponivel">
                        <td><img src="images/jogo1.jpg" alt="Jogo" width="50"></td>
                        <td>Elden Ring</td>
                        <td>PS5</td>
                        <td>12</td>
                        <td>59.99€</td>
                    </tr>
                    <tr class="item-esgotado">
                        <td><img src="images/jogo2.jpg" alt="Jogo" width="50"></td>
                        <td>Retro World</td>
                        <td>Switch</td>
                        <td>0</td>
                        <td>25.00€</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
