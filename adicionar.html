<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Item - Loja de Jogos</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header>
        <h1>Adicionar Item</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="inventory.html" class="button">Inventário</a>
        </nav>
    </header>

    <main>
        <section class="add-item">
            <h2>Novo jogo</h2>
            <form id="add-form">
                <label>Título
                    <input type="text" id="title" required>
                </label>
                <label>Plataforma
                    <input type="text" id="platform" required>
                </label>
                <label>Stock
                    <input type="number" id="stock" min="0" required>
                </label>
                <label>Preço
                    <input type="number" id="price" step="0.01" min="0" required>
                </label>
                <button type="submit">Salvar</button>
            </form>
        </section>

        <section class="database-container">
            <h2>Inventário Atual</h2>
            <table id="database-table">
                <thead>
                    <tr>
                        <th>Capa</th>
                        <th>Título</th>
                        <th>Plataforma</th>
                        <th>Stock</th>
                        <th>Preço</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </main>

    <script src="database.js"></script>
    <script>
        function renderDatabase() {
            const tbody = document.querySelector('#database-table tbody');
            tbody.innerHTML = '';
            database.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><img src="${item.img}" alt="${item.title}" width="50"></td>
                    <td>${item.title}</td>
                    <td>${item.platform}</td>
                    <td>${item.stock}</td>
                    <td>${item.price.toFixed(2)}€</td>
                `;
                tbody.appendChild(row);
            });
        }

        document.addEventListener('DOMContentLoaded', renderDatabase);

        document.getElementById('add-form').addEventListener('submit', event => {
            event.preventDefault();
            database.push({
                img: 'images/placeholder.jpg',
                title: document.getElementById('title').value,
                platform: document.getElementById('platform').value,
                stock: Number(document.getElementById('stock').value),
                price: Number(document.getElementById('price').value)
            });
            saveDatabase();
            renderDatabase();
            event.target.reset();
        });
    </script>
</body>
</html>
