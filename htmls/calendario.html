<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário - Loot Ledger Vault</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        :root { --arcane-gold: #F5D21D; }
        
        body {
            margin: 0; padding: 0;
            background: #111;
            color: var(--arcane-gold);
            font-family: 'VT323', monospace;
        }
        
        .calendar-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 30px;
            background: rgba(20, 20, 20, 0.95);
            border: 4px solid var(--arcane-gold);
            box-shadow: 0 0 60px var(--arcane-gold);
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 2.8rem;
            margin-bottom: 25px;
        }
        
        .nav-btn {
            background: transparent;
            border: 3px solid var(--arcane-gold);
            color: var(--arcane-gold);
            padding: 10px 30px;
            font-size: 1.8rem;
            cursor: pointer;
        }
        
        .nav-btn:hover { background: var(--arcane-gold); color: #000; }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            background: #1a1a1a;
            padding: 8px;
        }
        
        .day-header { text-align: center; padding: 15px; background: rgba(245,210,29,0.15); font-size: 1.5rem; }
        
        .day {
            background: #222;
            min-height: 130px;
            padding: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
        }
        .day:hover { border-color: var(--arcane-gold); }
        .day.today { background: rgba(245,210,29,0.25); border-color: var(--arcane-gold); }
        .day.other-month { opacity: 0.35; }
        
        .day-number { font-size: 1.8rem; margin-bottom: 8px; }
        
        .event {
            font-size: 1rem;
            padding: 3px 8px;
            margin: 3px 0;
            background: rgba(245,210,29,0.2);
            border-left: 4px solid var(--arcane-gold);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: #1a1a1a;
            border: 4px solid var(--arcane-gold);
            padding: 35px;
            width: 90%;
            max-width: 620px;
            color: var(--arcane-gold);
        }
        
        input, textarea, button {
            font-family: 'VT323', monospace;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #111;
            border: 2px solid var(--arcane-gold);
            color: var(--arcane-gold);
            font-size: 1.4rem;
        }
        
        button { cursor: pointer; }
        button:hover { background: var(--arcane-gold); color: #000; }
    </style>
</head>
<body>
    <div class="calendar-container">
        <header>
            <button class="nav-btn" onclick="prevMonth()">‹ Anterior</button>
            <div id="monthTitle"></div>
            <button class="nav-btn" onclick="nextMonth()">Próximo ›</button>
        </header>
        
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <!-- Modal -->
    <div id="eventModal" class="modal">
        <div class="modal-content">
            <h2 id="modalDate" style="margin-bottom:20px;"></h2>
            <div id="eventsList"></div>
            
            <h3 style="margin:25px 0 10px;">Adicionar Evento</h3>
            <input type="text" id="eventTitle" placeholder="Título do evento">
            <input type="time" id="eventTime">
            <textarea id="eventDesc" rows="3" placeholder="Descrição (opcional)"></textarea>
            
            <button onclick="addEventToDay()">Adicionar Evento</button>
            <button onclick="closeModal()" style="background:#333; margin-left:10px;">Fechar</button>
        </div>
    </div>

    <script>
        let currentDate = new Date();
        let selectedDate = null;
        let events = JSON.parse(localStorage.getItem('vault_events')) || {};

        function saveEvents() { localStorage.setItem('vault_events', JSON.stringify(events)); }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('monthTitle').innerHTML = 
                currentDate.toLocaleString('pt-PT', { month: 'long', year: 'numeric' }).toUpperCase();
            
            const daysOfWeek = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];
            daysOfWeek.forEach(d => {
                const el = document.createElement('div');
                el.className = 'day-header';
                el.textContent = d;
                grid.appendChild(el);
            });
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();
            
            for (let i = firstDay - 1; i >= 0; i--) {
                grid.appendChild(createDayElement(daysInPrevMonth - i, true));
            }
            for (let day = 1; day <= daysInMonth; day++) {
                grid.appendChild(createDayElement(day, false));
            }
            const remaining = 42 - grid.children.length;
            for (let day = 1; day <= remaining; day++) {
                grid.appendChild(createDayElement(day, true));
            }
        }

        function createDayElement(day, isOtherMonth) {
            const el = document.createElement('div');
            el.className = `day ${isOtherMonth ? 'other-month' : ''}`;
            
            const dateKey = `${currentDate.getFullYear()}-${String(currentDate.getMonth()+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            
            el.innerHTML = `<div class="day-number">${day}</div><div id="events-${dateKey}" style="font-size:0.9rem;"></div>`;
            
            if (events[dateKey]) {
                const container = el.querySelector(`#events-${dateKey}`);
                events[dateKey].slice(0, 3).forEach(ev => {
                    const e = document.createElement('div');
                    e.className = 'event';
                    e.textContent = ev.time ? `${ev.time} ${ev.title}` : ev.title;
                    container.appendChild(e);
                });
            }
            
            el.onclick = () => openDayModal(dateKey);
            return el;
        }

        function openDayModal(dateKey) {
            selectedDate = dateKey;
            document.getElementById('modalDate').textContent = `Eventos - ${dateKey}`;
            
            const list = document.getElementById('eventsList');
            list.innerHTML = events[dateKey] && events[dateKey].length > 0 
                ? events[dateKey].map((ev, i) => `
                    <div style="margin-bottom:15px;">
                        <strong>${ev.time || ''} ${ev.title}</strong><br>
                        ${ev.desc || ''}
                        <button onclick="deleteEvent('${dateKey}', ${i});" style="float:right;font-size:1rem;padding:4px 12px;">Remover</button>
                    </div>`).join('')
                : '<p style="opacity:0.6;">Nenhum evento neste dia.</p>';
            
            document.getElementById('eventModal').style.display = 'flex';
        }

        function addEventToDay() {
            const title = document.getElementById('eventTitle').value.trim();
            const time = document.getElementById('eventTime').value;
            const desc = document.getElementById('eventDesc').value.trim();
            
            if (!title) return alert("Escreve um título!");
            
            if (!events[selectedDate]) events[selectedDate] = [];
            events[selectedDate].push({ title, time, desc });
            
            saveEvents();
            closeModal();
            renderCalendar();
        }

        function deleteEvent(dateKey, index) {
            if (confirm("Eliminar evento?")) {
                events[dateKey].splice(index, 1);
                if (events[dateKey].length === 0) delete events[dateKey];
                saveEvents();
                openDayModal(dateKey);
                renderCalendar();
            }
        }

        function closeModal() {
            document.getElementById('eventModal').style.display = 'none';
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventTime').value = '';
            document.getElementById('eventDesc').value = '';
        }

        function prevMonth() { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); }
        function nextMonth() { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); }

        renderCalendar();
    </script>
</body>
</html>
