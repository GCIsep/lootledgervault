<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loot Ledger Vault • Calendário Arcano</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        :root { --arcane-gold: #F5D21D; }
        
        body {
            margin: 0; padding: 0;
            background: #000 url('images/fundo_do_Index_estrelas.png') center/cover fixed;
            color: var(--arcane-gold);
            font-family: 'VT323', monospace;
            min-height: 100vh;
        }
        
        .calendar-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 25px;
            background: rgba(8, 6, 12, 0.94);
            border: 4px solid var(--arcane-gold);
            box-shadow: 0 0 60px var(--arcane-gold);
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 2.2rem;
        }
        
        .nav-btn {
            background: transparent;
            border: 2px solid var(--arcane-gold);
            color: var(--arcane-gold);
            padding: 8px 20px;
            cursor: pointer;
            font-size: 1.8rem;
        }
        
        .nav-btn:hover { background: var(--arcane-gold); color: #000; }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            background: #111;
            padding: 4px;
        }
        
        .day-header {
            text-align: center;
            padding: 12px;
            background: rgba(245, 210, 29, 0.1);
            font-size: 1.4rem;
        }
        
        .day {
            background: rgba(10, 10, 10, 0.9);
            min-height: 110px;
            padding: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .day:hover { border-color: var(--arcane-gold); }
        .day.other-month { opacity: 0.4; }
        .day.today { background: rgba(245, 210, 29, 0.2); border-color: var(--arcane-gold); }
        
        .day-number { font-size: 1.6rem; margin-bottom: 6px; }
        
        .event {
            font-size: 1rem;
            padding: 2px 6px;
            margin: 2px 0;
            background: rgba(245, 210, 29, 0.15);
            border-left: 4px solid var(--arcane-gold);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: rgba(8, 6, 12, 0.98);
            border: 4px solid var(--arcane-gold);
            padding: 30px;
            width: 90%;
            max-width: 600px;
            color: var(--arcane-gold);
        }
        
        input, textarea, button {
            font-family: 'VT323', monospace;
            background: rgba(0,0,0,0.7);
            border: 2px solid var(--arcane-gold);
            color: var(--arcane-gold);
            padding: 10px;
            margin: 8px 0;
            width: 100%;
        }
        
        button { cursor: pointer; font-size: 1.6rem; }
        button:hover { background: var(--arcane-gold); color: #000; }
    </style>
</head>
<body>
    <div class="calendar-container">
        <header>
            <button class="nav-btn" onclick="prevMonth()">‹ Anterior</button>
            <div id="monthTitle"></div>
            <button class="nav-btn" onclick="nextMonth()">Próximo ›</button>
        </header>
        
        <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <!-- Modal de eventos do dia -->
    <div id="eventModal" class="modal">
        <div class="modal-content">
            <h2 id="modalDate"></h2>
            <div id="eventsList"></div>
            
            <h3>Adicionar Evento</h3>
            <input type="text" id="eventTitle" placeholder="Título do evento">
            <input type="time" id="eventTime">
            <textarea id="eventDesc" placeholder="Descrição (opcional)" rows="3"></textarea>
            
            <button onclick="addEventToDay()">Adicionar ao Calendário</button>
            <button onclick="closeModal()" style="background:#333;">Fechar</button>
        </div>
    </div>

    <script>
        let currentDate = new Date();
        let selectedDate = null;
        let events = JSON.parse(localStorage.getItem('vault_events')) || {};

        function saveEvents() {
            localStorage.setItem('vault_events', JSON.stringify(events));
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('monthTitle').textContent = 
                currentDate.toLocaleString('pt-PT', { month: 'long', year: 'numeric' }).toUpperCase();
            
            // Dias da semana
            const daysOfWeek = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];
            daysOfWeek.forEach(day => {
                const el = document.createElement('div');
                el.className = 'day-header';
                el.textContent = day;
                grid.appendChild(el);
            });
            
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();
            
            // Dias do mês anterior
            for (let i = firstDay - 1; i >= 0; i--) {
                const dayEl = createDayElement(daysInPrevMonth - i, true);
                grid.appendChild(dayEl);
            }
            
            // Dias do mês atual
            for (let day = 1; day <= daysInMonth; day++) {
                const dayEl = createDayElement(day, false);
                grid.appendChild(dayEl);
            }
            
            // Dias do próximo mês
            const remaining = 42 - grid.children.length;
            for (let day = 1; day <= remaining; day++) {
                const dayEl = createDayElement(day, true);
                grid.appendChild(dayEl);
            }
        }

        function createDayElement(day, isOtherMonth) {
            const el = document.createElement('div');
            el.className = `day ${isOtherMonth ? 'other-month' : ''}`;
            
            const dateKey = `${currentDate.getFullYear()}-${String(currentDate.getMonth()+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
            
            el.innerHTML = `
                <div class="day-number">${day}</div>
                <div id="events-${dateKey}" style="font-size:0.9rem;"></div>
            `;
            
            // Mostrar eventos do dia
            if (events[dateKey]) {
                const container = el.querySelector(`#events-${dateKey}`);
                events[dateKey].slice(0, 3).forEach(ev => {
                    const dot = document.createElement('div');
                    dot.className = 'event';
                    dot.textContent = ev.time ? `${ev.time} ${ev.title}` : ev.title;
                    container.appendChild(dot);
                });
            }
            
            el.onclick = () => openDayModal(dateKey);
            return el;
        }

        function openDayModal(dateKey) {
            selectedDate = dateKey;
            document.getElementById('modalDate').textContent = `Eventos - ${dateKey}`;
            
            const list = document.getElementById('eventsList');
            list.innerHTML = '';
            
            if (events[dateKey] && events[dateKey].length > 0) {
                events[dateKey].forEach((ev, index) => {
                    const div = document.createElement('div');
                    div.style.marginBottom = '12px';
                    div.innerHTML = `
                        <strong>${ev.time || ''} ${ev.title}</strong><br>
                        ${ev.desc || ''}
                        <button onclick="deleteEvent('${dateKey}', ${index});" style="float:right; font-size:1rem; padding:4px 12px;">Remover</button>
                    `;
                    list.appendChild(div);
                });
            } else {
                list.innerHTML = '<p style="opacity:0.6;">Nenhum evento neste dia.</p>';
            }
            
            document.getElementById('eventModal').style.display = 'flex';
        }

        function addEventToDay() {
            const title = document.getElementById('eventTitle').value.trim();
            const time = document.getElementById('eventTime').value;
            const desc = document.getElementById('eventDesc').value.trim();
            
            if (!title) return alert("Escreve um título para o evento");
            
            if (!events[selectedDate]) events[selectedDate] = [];
            
            events[selectedDate].push({ title, time, desc });
            saveEvents();
            closeModal();
            renderCalendar();
        }

        function deleteEvent(dateKey, index) {
            if (confirm("Eliminar este evento?")) {
                events[dateKey].splice(index, 1);
                if (events[dateKey].length === 0) delete events[dateKey];
                saveEvents();
                openDayModal(dateKey); // atualiza o modal
                renderCalendar();
            }
        }

        function closeModal() {
            document.getElementById('eventModal').style.display = 'none';
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventTime').value = '';
            document.getElementById('eventDesc').value = '';
        }

        function prevMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        }

        // Inicializar
        renderCalendar();
    </script>
</body>
</html>
