<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loot Ledger Vault • O Grimório Desperta</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        :root {
            --arcane-gold: #F5D21D;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: var(--arcane-gold);
            font-family: 'VT323', monospace;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }
        
        #video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        
        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.4);
            pointer-events: none;
        }
        
        .title {
            font-size: 3.8rem;
            text-shadow: 0 0 40px var(--arcane-gold);
            letter-spacing: 8px;
            margin-bottom: 30px;
        }
        
        .instruction {
            font-size: 2.1rem;
            text-shadow: 0 0 25px var(--arcane-gold);
            animation: pulse 2s infinite;
        }
        
        /* HOTSPOT - COMPLETAMENTE TRANSPARENTE (mesmo no hover) */
        .hotspot {
            position: absolute;
            top: 42%;
            left: 36%;
            width: 30%;
            height: 45%;
            z-index: 3;
            cursor: pointer;
            /* Tudo invisível */
            border: none;
            background: transparent;
            box-shadow: none;
            opacity: 0;
        }
        
        .hotspot:hover {
            /* Continua completamente transparente no hover */
            border: none;
            background: transparent;
            box-shadow: none;
            opacity: 0;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        
        .scanline {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(245, 210, 29, 0.09) 50%);
            background-size: 100% 8px;
            pointer-events: none;
            animation: scan 4s linear infinite;
            z-index: 4;
        }
        
        @keyframes scan {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }
    </style>
</head>
<body>
    <!-- Vídeo -->
    <video id="video" autoplay muted loop playsinline>
        <source src="images/Vid_1.mp4" type="video/mp4">
        O teu browser não suporta vídeo.
    </video>


    <!-- Caixa clicável invisível -->
    <div class="hotspot" onclick="enterVault()"></div>

    <div class="scanline"></div>

    <script>
        function enterVault() {
            document.body.style.transition = 'opacity 1.8s ease';
            document.body.style.opacity = '0';
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1600);
        }

        console.log('%cGrimório Arcano carregado — Hotspot invisível ativado', 'color:#F5D21D; font-family:monospace');
    </script>
</body>
</html>
